<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieRec - Mi Historial</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a0a13;
            --card-bg: rgba(45, 19, 34, 0.6);
            --accent-color: #ff4d94;
            --accent-hover: #ff1a75;
            --text-color: #ffffff;
            --secondary-text: #fbc6d9;
            --star-color: #ffb800;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #3d162d 0%, #1a0a13 100%);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
        }

        /* --- NAVBAR --- */
        .navbar {
            background-color: rgba(45, 19, 34, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 77, 148, 0.3);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.8rem;
            text-decoration: none;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 77, 148, 0.5);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .dropbtn {
            background: none;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .dropbtn:hover {
            border-color: var(--accent-color);
            background: rgba(255, 77, 148, 0.1);
        }

        .btn-logout {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            margin-top: 120px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 40px;
            border-left: 6px solid var(--accent-color);
            padding-left: 20px;
            font-weight: 700;
        }

        /* --- GRID Y TARJETAS --- */
        .diario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 35px;
        }

        .movie-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 24px;
            border: 1px solid rgba(255, 77, 148, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease backwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Retardo en cascada para las tarjetas */
        .movie-card:nth-child(n) { animation-delay: calc(0.1s * var(--i, 1)); }

        .movie-card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: var(--accent-color);
            box-shadow: 0 15px 35px rgba(255, 77, 148, 0.25);
            background: rgba(45, 19, 34, 0.9);
        }

        /* Badge de puntuación flotante */
        .rating-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            color: var(--star-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 184, 0, 0.3);
            z-index: 2;
        }

        .movie-poster {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .movie-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin: 10px 0;
            min-height: 2.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- BOTÓN ELIMINAR --- */
        .btn-delete {
            background-color: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.4);
            padding: 10px;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
            font-weight: 600;
            opacity: 0.6; /* Semi-transparente por defecto */
        }

        .movie-card:hover .btn-delete {
            opacity: 1; /* Se ilumina al pasar el ratón por la tarjeta */
        }

        .btn-delete:hover {
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
            border: 2px dashed rgba(255, 77, 148, 0.2);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/principal}" class="logo">MOVIEREC</a>
        <div class="nav-links">
            <a th:href="@{/principal}" style="text-decoration: none;">
                <button class="dropbtn">🏠 RECOMENDADOR</button>
            </a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="main-content">
    <h2 class="page-title">Mi Diario de Cine 🍿</h2>

    <div th:if="${#lists.isEmpty(peliculas)}" class="empty-msg">
        <h3 style="color: var(--secondary-text)">Tu historial está vacío</h3>
        <p>Parece que aún no has valorado ninguna película. ¡Vuelve al recomendador!</p>
        <br>
        <a th:href="@{/principal}" style="color: var(--accent-color); font-weight: bold;">Ir a buscar películas</a>
    </div>

    <div class="diario-grid">
        <div class="movie-card" th:each="peli, iter : ${peliculas}" th:style="'--i: ' + ${iter.index}">

            <div class="rating-badge">
                <span th:text="${peli.estrellas}">0.0</span> ⭐
            </div>

            <img th:src="${peli.poster}" alt="Poster" class="movie-poster">

            <div class="movie-title" th:text="${peli.titulo}">Título de la Película</div>

            <form th:action="@{/eliminar/{id}(id=${peli.id})}" method="post">
                <button type="submit" class="btn-delete"
                        onclick="return confirm('¿Eliminar esta película de tu historial?')">
                    🗑️ Quitar del diario
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
