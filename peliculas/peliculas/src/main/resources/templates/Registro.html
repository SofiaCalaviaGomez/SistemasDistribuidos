<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MovieRec - Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #1a0a13; --card-bg: #2d1322; --accent-color: #ff4d94; --text-color: #ffffff; --input-bg: rgba(255, 255, 255, 0.05); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: radial-gradient(circle at center, #3d162d 0%, #1a0a13 100%); color: var(--text-color); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-container { background-color: var(--card-bg); padding: 3rem; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 350px; border: 1px solid rgba(255, 77, 148, 0.3); text-align: center; }
        h2 { color: var(--accent-color); margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 77, 148, 0.5); }
        input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid rgba(255, 77, 148, 0.2); border-radius: 10px; color: white; box-sizing: border-box; margin-bottom: 1.5rem; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 10px rgba(255, 77, 148, 0.3); }
        .btn-submit { width: 100%; padding: 12px; background-color: var(--accent-color); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { transform: scale(1.02); background-color: #ff1a75; }
        .back-link { display: block; margin-top: 1.5rem; color: var(--accent-color); text-decoration: none; font-size: 0.9rem; }
        .error-msg { color: #ffeb3b; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Únete a MovieRec</h2>

    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <input type="text" th:field="*{nombre}" placeholder="Tu nombre completo" required>

        <input type="text" th:field="*{username}" placeholder="Elige un usuario" required>

        <input type="password" th:field="*{password}" placeholder="Crea una contraseña" required>

        <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <a th:href="@{/login}" class="back-link">¿Ya tienes cuenta? Inicia sesión</a>
</div>
</body>
</html>
