<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieRec - Mi Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a0a13;
            --card-bg: rgba(45, 19, 34, 0.6);
            --accent-color: #ff4d94;
            --accent-hover: #ff1a75;
            --text-color: #ffffff;
            --secondary-text: #fbc6d9;
            --danger-color: #ff4d4d;
            --danger-hover: #ff1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #3d162d 0%, #1a0a13 100%);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
        }

        /* --- NAVBAR --- */
        .navbar {
            background-color: rgba(45, 19, 34, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 77, 148, 0.3);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.8rem;
            text-decoration: none;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 77, 148, 0.5);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .dropbtn {
            background: none;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .dropbtn:hover {
            border-color: var(--accent-color);
            background: rgba(255, 77, 148, 0.1);
        }

        /* --- CONTENEDOR PERFIL --- */
        .main-content {
            margin-top: 120px;
            padding: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 77, 148, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .page-title {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 30px;
            border-left: 6px solid var(--accent-color);
            padding-left: 15px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary-text);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 77, 148, 0.3);
        }

        input:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            cursor: not-allowed;
        }

        .btn-submit {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 148, 0.4);
        }

        .divider {
            border-top: 1px solid rgba(255, 77, 148, 0.2);
            margin: 35px 0;
        }

        .danger-zone {
            background: rgba(255, 77, 77, 0.05);
            border: 1px dashed rgba(255, 77, 77, 0.3);
            padding: 20px;
            border-radius: 16px;
        }

        .danger-zone h3 {
            margin-top: 0;
            color: var(--danger-color);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        .btn-danger:hover {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }

        .alert-success {
            background: rgba(77, 255, 148, 0.1);
            border: 1px solid #4dff94;
            color: #4dff94;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/principal}" class="logo">MOVIEREC</a>
        <div class="nav-links">
            <a th:href="@{/principal}" style="text-decoration: none;"><button class="dropbtn">🏠 RECOMENDADOR</button></a>
            <a th:href="@{/diario}" style="text-decoration: none;"><button class="dropbtn">🍿 MI DIARIO</button></a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="profile-card">
        <h2 class="page-title">Configuración de Perfil ⚙️</h2>

        <div th:if="${param.exito}" class="alert-success">
            ¡Datos actualizados correctamente!
        </div>

        <form th:action="@{/perfil/actualizar}" method="post">
            <div class="form-group">
                <label>Nombre de Usuario (No modificable)</label>
                <input type="text" th:value="${usuario.username}" disabled>
            </div>

            <div class="form-group">
                <label>Tu Nombre Real</label>
                <input type="text" name="nombre" th:value="${usuario.nombre}" placeholder="Inserta tu nombre" required>
            </div>

            <div class="form-group">
                <label>Nueva Contraseña (Dejar en blanco para mantener la actual)</label>
                <input type="password" name="password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Guardar Cambios</button>
        </form>

        <div class="divider"></div>

        <div class="danger-zone">
            <h3>Zona de Peligro</h3>
            <p style="font-size: 0.85rem; color: var(--secondary-text); margin-bottom: 15px;">
                Al eliminar tu cuenta se borrarán permanentemente tus datos y tu historial de películas. Esta acción no se puede deshacer.
            </p>
            <form th:action="@{/perfil/eliminar}" method="post"
                  onclick="return confirm('¿Estás COMPLETAMENTE seguro de que quieres borrar tu cuenta? Perderás todo tu historial.')">
                <button type="submit" class="btn-danger">🗑️ Eliminar mi cuenta</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
