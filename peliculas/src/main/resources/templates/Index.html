<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MovieRec - Tu Cine Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f171e;
            --card-bg: #1b2228;
            --accent-color: #ff4d94; /* Dorado tipo IMDb */
            --text-color: #ffffff;
            --secondary-text: #9ab;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Fondo con gradiente para dar profundidad */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1b2228 0%, #0f171e 100%);
            z-index: -1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgb(250 153 253);
        }

        p {
            color: var(--secondary-text);
            font-size: 1.2rem;
        }

        .menu-container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 350px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn {
            padding: 1rem;
            border-radius: 10px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .btn-login {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-login:hover {
            background-color: #ff4d94;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgb(204 24 245 / 0, 4);
        }

        .btn-register {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .btn-register:hover {
            border-color: var(--text-color);
            background-color: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<header>
    <h1>MovieRec</h1>
    <p>Encuentra tu próxima historia favorita</p>
</header>

<div class="menu-container">
    <a th:href="@{/login}" class="btn btn-login">Iniciar Sesión</a>
    <a th:href="@{/registro}" class="btn btn-register">Crear Cuenta</a>
</div>

</body>
</html>
