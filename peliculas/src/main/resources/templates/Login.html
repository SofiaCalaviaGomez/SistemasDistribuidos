<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MovieRec - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a0a13;
            --card-bg: #2d1322;
            --accent-color: #ff4d94;
            --text-color: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #3d162d 0%, #1a0a13 100%);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 350px;
            border: 1px solid rgba(255, 77, 148, 0.3);
            text-align: center;
        }

        h2 {
            color: var(--accent-color);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 77, 148, 0.5);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 77, 148, 0.2);
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 77, 148, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            background-color: #ff1a75;
        }

        .error-msg {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Bienvenido</h2>

    <div th:if="${param.error}" class="error-msg">
        Usuario o contraseña incorrectos.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <input type="text" name="username" placeholder="Nombre de usuario" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <a th:href="@{/}" class="back-link">← Volver al inicio</a>
</div>
</body>
</html>
