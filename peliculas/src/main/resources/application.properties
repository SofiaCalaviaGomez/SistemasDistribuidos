# CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL (DOCKER)
spring.datasource.url=jdbc:postgresql://localhost/movierec_db
spring.datasource.username=postgres
spring.datasource.password=postgres_root

# DRIVER Y DIALECTO DE JPA PARA POSTGRES
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ESTRATEGIA DE CREACIÓN DE TABLAS
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola de IntelliJ
spring.jpa.show-sql=true