version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: movierec_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_root
      POSTGRES_DB: movierec_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 📬 MAILPIT: El servidor de correos para interceptar la activación
  mailpit:
    image: axllent/mailpit
    container_name: movierec_mailpit_container
    restart: always
    ports:
      - "1025:1025" # Puerto SMTP que usa Spring Boot en application.properties
      - "8025:8025" # Puerto Web para ver la bandeja de entrada en el navegador

volumes:
  postgres_data: